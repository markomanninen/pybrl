[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pybrl"
version = "0.3.0"
description = "Braille (6-dot cell patterns) for Python 3"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Marko Manninen"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
pybrl = "pybrl.main:cli"

[tool.setuptools]
packages = ["pybrl"]
